name: blog autopilot

on:
  # só pra quem usa a api do claude: descomente pra rodar seg, qua e sex às 9h17 (brasília)
  # schedule:
  #   - cron: "17 12 * * 1,3,5"
  workflow_dispatch:
    inputs:
      ideias:
        description: "gerar N palavras-chave novas em vez de escrever (deixe vazio para escrever)"
        required: false

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-autopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: escrever / gerar ideias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.ideias }}" ]; then
            python autopilot.py --ideias "${{ github.event.inputs.ideias }}"
          else
            python autopilot.py
          fi
      - name: salvar progresso no repositório
        run: |
          git config user.name "blog-autopilot"
          git config user.email "blog-autopilot@users.noreply.github.com"
          git add keywords.csv posts
          git diff --cached --quiet || git commit -m "blog autopilot: $(date +%F)"
          git push
